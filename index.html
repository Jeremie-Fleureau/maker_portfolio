<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electronics Projects — Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0e11;
      --card-bg: #14161b;
      --border: #22252d;
      --text-main: #f0f2f5;
      --text-muted: #8b929e;
      --accent-cyan: #38bdf8;
      --accent-orange: #fb923c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-orange);
      background: rgba(251, 146, 60, 0.1);
      border: 1px solid rgba(251, 146, 60, 0.25);
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-orange);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-orange);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #fff;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .upcoming-preview {
      border-top: 1px solid var(--border);
      padding-top: 24px;
      margin-top: 8px;
    }

    .upcoming-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: #d1d5db;
    }

    .tag.highlight {
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="badge">
      <span class="status-dot"></span>
      Workbench Active
    </div>

    <h1>Electronics Projects</h1>
    <p>
      Comprehensive build guides, schematics, and documentation are currently being finalized on the bench. Check back soon for full releases.
    </p>

    <div class="upcoming-preview">
      <div class="upcoming-title">Builds in queue</div>
      <div class="tags">
        <span class="tag highlight">DRSSTC</span>
        <span class="tag">Mini Tesla Coil</span>
        <span class="tag highlight">Induction Heating</span>
        <span class="tag">Wireless Power</span>
        <span class="tag">Autonomous RC</span>
      </div>
    </div>
  </main>

</body>
</html>
